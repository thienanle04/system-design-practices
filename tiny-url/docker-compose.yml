services:
  postgres:
    image: postgres:16-alpine
    container_name: tinyurl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tinyurl}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tinyurl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tinyurl-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: tinyurl-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 4L622nShTUiBen8hkUZAJA
    volumes:
      - kafka_data:/var/lib/kafka/data

  kgs-service:
    build:
      context: .
      dockerfile: apps/kgs-service/Dockerfile
    container_name: tinyurl-kgs
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tinyurl}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  url-service-1:
    build:
      context: .
      dockerfile: apps/url-service/Dockerfile
    container_name: tinyurl-api-1
    restart: unless-stopped
    environment:
      INSTANCE_NAME: url-service-1
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tinyurl}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  url-service-2:
    build:
      context: .
      dockerfile: apps/url-service/Dockerfile
    container_name: tinyurl-api-2
    restart: unless-stopped
    environment:
      INSTANCE_NAME: url-service-2
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tinyurl}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  analytics-service:
    build:
      context: .
      dockerfile: apps/analytics-service/Dockerfile
    container_name: tinyurl-analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tinyurl}
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: analytics-consumer-group
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  load-balancer:
    image: nginx:alpine
    container_name: tinyurl-lb
    restart: unless-stopped
    volumes:
      - ./infra/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - url-service-1
      - url-service-2

  mock-cdn:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile.cdn
    container_name: tinyurl-cdn
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - load-balancer

volumes:
  postgres_data:
  redis_data:
  kafka_data:
