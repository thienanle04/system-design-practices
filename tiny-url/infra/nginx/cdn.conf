proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=CDN_CACHE:10m max_size=500m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # Expose cache status on all responses
    add_header X-Cache-Status $upstream_cache_status always;

    # Root route serves the React SPA
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Dashboard SPA route (prefix match takes priority over regex short_code)
    location ^~ /dashboard {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Static assets for React
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|map)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Real-time SSE events (Disable buffering, cache, and increase timeout)
    location /api/v1/events/ {
        proxy_pass http://load-balancer;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API requests (Bypass cache)
    location /api/ {
        proxy_pass http://load-balancer;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Support /r/{code} or /{code} for short URL redirection with Edge Caching
    location ~ ^/(?:r/)?([a-zA-Z0-9_-]+)$ {
        set $short_code $1;
        proxy_pass http://load-balancer/$short_code;
        
        # Edge Cache rules
        proxy_cache CDN_CACHE;
        proxy_cache_key "$scheme$request_method$host$short_code";
        
        # Cache 302/307 redirects for 30s as per ADR-0002
        proxy_cache_valid 302 307 30s;
        
        # Cache 404/410 for 10s to absorb bad traffic
        proxy_cache_valid 404 410 10s;

        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
